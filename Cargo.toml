[workspace]
members = ["mods/boldy-mods", "mods/boldy-mods/pack", "mods/hive-autocs", "mods/hive-autocs/pack"]
default-members = ["mods/boldy-mods"]
resolver = "3"

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.99.0"

[workspace.dependencies]
mod-api = { git = "https://github.com/cinnabar-mc/cinnabar", rev = "1b11792886a54c48607a8a6e02f850af741c7492" }

[profile.release]
# Callback fuel is bounded by the host; optimize execution rather than file size.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

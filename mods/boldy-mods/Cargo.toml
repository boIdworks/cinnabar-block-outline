[package]
name = "boldy-mods"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "Boldy Mods: a Cinnabar personal mod that outlines the block or mob you aim at"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Measures the fuel each feature uses and saves it as `fuel_report` in the settings file. Costs fuel
# itself, so never in a shipped build: `python scripts/build-mod.py --fuel-profile`.
fuel-profile = []

[dependencies]
mod-api.workspace = true
